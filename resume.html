<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050507'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' text-anchor='middle' fill='%23a8c5ff'%3EJU%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:#050507; --text:#f0f0f5; --sub:#8888a0;
      --accent:#a8c5ff; --line:rgba(255,255,255,.06);
    }
    html, body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); }

    nav {
      position:fixed; top:0; width:100%; z-index:1000;
      backdrop-filter:blur(24px); background:rgba(5,5,7,.85);
      border-bottom:1px solid var(--line);
    }
    .nav-container {
      width:90%; max-width:1400px; margin:auto;
      height:68px; display:flex; align-items:center; justify-content:space-between;
    }
    .logo { font-family:'DM Serif Display',serif; font-size:1.15rem; text-decoration:none; color:var(--text); }
    .nav-links { display:flex; gap:2rem; align-items:center; }
    .nav-links a { color:var(--sub); text-decoration:none; transition:color .25s; font-size:.9rem; font-weight:500; }
    .nav-links a:hover { color:var(--text); }
    /* ── NAV DROPDOWN (shared across all pages) ── */
    .nav-links { align-items:center; }
    .nav-dropdown { position:relative; display:flex; align-items:center; }
    .nav-dropdown-toggle {
      color:var(--sub); font-size:.9rem; font-weight:500;
      background:none; border:none; cursor:pointer;
      display:flex; align-items:center; gap:.35rem;
      padding:0; font-family:'DM Sans',sans-serif; transition:color .25s;
    }
    .nav-dropdown-toggle:hover, .nav-dropdown.open .nav-dropdown-toggle { color:var(--text); }
    .nav-dropdown-toggle svg { width:10px; height:10px; transition:transform .25s; }
    .nav-dropdown.open .nav-dropdown-toggle svg { transform:rotate(180deg); }
    .dropdown-menu {
      display:none; position:absolute; top:calc(100% + 16px); left:50%;
      transform:translateX(-50%);
      background:rgba(13,13,18,.97); backdrop-filter:blur(20px);
      border:1px solid rgba(255,255,255,.08); border-radius:14px;
      padding:.6rem; min-width:250px; z-index:100;
      box-shadow:0 16px 48px rgba(0,0,0,.5);
    }
    .nav-dropdown.open .dropdown-menu { display:block; }
    .nav-links .dropdown-menu a {
      display:block; padding:.65rem 1rem; border-radius:8px;
      color:var(--sub); text-decoration:none; font-size:.875rem;
      transition:background .2s, color .2s; white-space:nowrap;
    }
    .nav-links .dropdown-menu a:hover { background:rgba(255,255,255,.06); color:var(--text); }
    .dropdown-divider { height:1px; background:rgba(255,255,255,.06); margin:.4rem .5rem; }
    @media(max-width:600px) {
      .nav-links { gap:1.1rem; }
      .logo { font-size:1rem; }
      .dropdown-menu { left:auto; right:-4.5rem; transform:none; }
    }

    /* ── BOTTOM BACK LINK (project pages) ── */
    .bottom-nav { padding:3.5rem 0 4.5rem; text-align:center; border-top:1px solid var(--line); position:relative; z-index:1; }
    .bottom-nav a {
      display:inline-block; padding:.9rem 1.8rem; border-radius:999px;
      color:var(--text); background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08);
      text-decoration:none; font-weight:500; font-size:.95rem; transition:all .25s;
    }
    .bottom-nav a:hover { background:rgba(255,255,255,.09); transform:translateY(-3px); }

    /* Sections/figures that stay hidden until their image file exists on GitHub */
    .pending:not(.ready) { display:none; }

    /* toolbar */
    .toolbar {
      position:fixed; top:68px; left:0; width:100%; z-index:999;
      display:flex; align-items:center; justify-content:space-between;
      padding:.8rem 5%; background:rgba(13,13,18,.95);
      border-bottom:1px solid var(--line); gap:1rem; flex-wrap:wrap;
    }
    .back-link {
      display:inline-flex; align-items:center; gap:.4rem;
      color:var(--sub); text-decoration:none; font-size:.875rem; transition:color .2s;
    }
    .back-link:hover { color:var(--text); }
    .toolbar-title { color:var(--sub); font-size:.875rem; }

    .btn-download {
      display:inline-flex; align-items:center; gap:.5rem;
      padding:.6rem 1.3rem; border-radius:999px;
      background:var(--text); color:#050507;
      text-decoration:none; font-weight:500; font-size:.85rem;
      transition:transform .2s, box-shadow .2s; flex-shrink:0;
      border:none; cursor:pointer; font-family:'DM Sans',sans-serif;
    }
    .btn-download:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(168,197,255,.2); }

    /* Resume image container */
    .resume-container {
      margin-top:116px; /* nav (68) + toolbar (~48) */
      padding:3rem 0 5rem;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .resume-img-wrap {
      width:100%;
      max-width:860px;
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 0 0 1px rgba(168,197,255,.1), 0 32px 80px rgba(0,0,0,.6);
    }
    .resume-img-wrap img {
      width:100%;
      display:block;
    }

    .download-row {
      margin-top:2rem;
      display:flex;
      justify-content:center;
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-container">

      <div class="nav-links">

        <div class="nav-dropdown" id="projectsDropdown">
          <button class="nav-dropdown-toggle" type="button" aria-haspopup="true" aria-expanded="false">

            <a href="all-projects.html#archive">Archive</a>

        </div>
        <a href="resume.html">Resume</a>
      </div>
    </div>
  </nav>

  <div class="toolbar">
    <div style="display:flex;align-items:center;gap:1rem;">
      <a href="index.html" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>

      <img src="https://raw.githubusercontent.com/junikel12/portfolio/main/Resume%20november%202026.png"
           alt="Jordan Unikel Resume — November 2026">
    </div>
    <div class="download-row">
      <a href="https://raw.githubusercontent.com/junikel12/portfolio/main/resume.pdf"
         download="Jordan_Unikel_Resume.pdf"
         class="btn-download">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download PDF
      </a>
    </div>
  </div>

  <script>
    /* Projects dropdown: click to open, click outside or Esc to close */
    (function () {
      var d = document.getElementById('projectsDropdown');
      if (!d) return;
      var b = d.querySelector('.nav-dropdown-toggle');
      function set(open) { d.classList.toggle('open', open); b.setAttribute('aria-expanded', open); }
      b.addEventListener('click', function (e) { e.stopPropagation(); set(!d.classList.contains('open')); });
      document.addEventListener('click', function (e) { if (!d.contains(e.target)) set(false); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') set(false); });
    })();
  </script>
</body>
