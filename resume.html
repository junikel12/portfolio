<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume | Jordan Unikel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:#050507; --text:#f0f0f5; --sub:#8888a0;
      --accent:#a8c5ff; --line:rgba(255,255,255,.06);
    }
    html, body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); }

    nav {
      position:fixed; top:0; width:100%; z-index:1000;
      backdrop-filter:blur(24px); background:rgba(5,5,7,.85);
      border-bottom:1px solid var(--line);
    }
    .nav-container {
      width:90%; max-width:1400px; margin:auto;
      height:68px; display:flex; align-items:center; justify-content:space-between;
    }
    .logo { font-family:'DM Serif Display',serif; font-size:1.15rem; text-decoration:none; color:var(--text); }
    .nav-links { display:flex; gap:2rem; align-items:center; }
    .nav-links a { color:var(--sub); text-decoration:none; transition:color .25s; font-size:.9rem; font-weight:500; }
    .nav-links a:hover { color:var(--text); }

    /* toolbar */
    .toolbar {
      position:fixed; top:68px; left:0; width:100%; z-index:999;
      display:flex; align-items:center; justify-content:space-between;
      padding:.8rem 5%; background:rgba(13,13,18,.95);
      border-bottom:1px solid var(--line); gap:1rem; flex-wrap:wrap;
    }
    .back-link {
      display:inline-flex; align-items:center; gap:.4rem;
      color:var(--sub); text-decoration:none; font-size:.875rem; transition:color .2s;
    }
    .back-link:hover { color:var(--text); }
    .toolbar-title { color:var(--sub); font-size:.875rem; }

    .btn-download {
      display:inline-flex; align-items:center; gap:.5rem;
      padding:.6rem 1.3rem; border-radius:999px;
      background:var(--text); color:#050507;
      text-decoration:none; font-weight:500; font-size:.85rem;
      transition:transform .2s, box-shadow .2s; flex-shrink:0;
      border:none; cursor:pointer; font-family:'DM Sans',sans-serif;
    }
    .btn-download:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(168,197,255,.2); }

    /* Resume image container */
    .resume-container {
      margin-top:116px; /* nav (68) + toolbar (~48) */
      padding:3rem 0 5rem;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .resume-img-wrap {
      width:100%;
      max-width:860px;
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 0 0 1px rgba(168,197,255,.1), 0 32px 80px rgba(0,0,0,.6);
    }
    .resume-img-wrap img {
      width:100%;
      display:block;
    }

    .download-row {
      margin-top:2rem;
      display:flex;
      justify-content:center;
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-container">
      <a href="index.html" class="logo">Jordan Unikel</a>
      <div class="nav-links">
        <a href="index.html#about">About</a>
        <a href="all-projects.html">Projects</a>
        <a href="resume.html">Resume</a>
      </div>
    </div>
  </nav>

  <div class="toolbar">
    <div style="display:flex;align-items:center;gap:1rem;">
      <a href="index.html" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Back
      </a>
      <span class="toolbar-title">Jordan Unikel — Resume</span>
    </div>
    <a href="https://raw.githubusercontent.com/junikel12/portfolio/main/resume.pdf"
       download="Jordan_Unikel_Resume.pdf"
       class="btn-download">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Download PDF
    </a>
  </div>

  <div class="resume-container">
    <div class="resume-img-wrap">
      <img src="https://raw.githubusercontent.com/junikel12/portfolio/main/Screenshot%202026-06-01%20200440.png"
           alt="Jordan Unikel Resume">
    </div>
    <div class="download-row">
      <a href="https://raw.githubusercontent.com/junikel12/portfolio/main/resume.pdf"
         download="Jordan_Unikel_Resume.pdf"
         class="btn-download">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download PDF
      </a>
    </div>
  </div>

</body>
</html>
